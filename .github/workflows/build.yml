name: Build JARVIS APK

# Works in two ways:
#  1) jarvis.zip is uploaded in the repository root  -> it is unpacked and built
#  2) the unpacked project files are in the repository -> they are built directly
# The finished APK is published on the repository's Releases page as JARVIS.apk
# (and also kept as a run artifact).

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-jarvis
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Find the project
        run: |
          set -e
          if [ -f jarvis.zip ]; then
            mkdir -p "$RUNNER_TEMP/proj"
            unzip -q jarvis.zip -d "$RUNNER_TEMP/proj"
            G=$(find "$RUNNER_TEMP/proj" -name gradlew -type f | head -n 1)
            test -n "$G" || { echo "gradlew not found inside jarvis.zip"; exit 1; }
            echo "PROJECT_DIR=$(dirname "$G")" >> "$GITHUB_ENV"
          elif [ -f gradlew ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            echo "No jarvis.zip and no gradlew found in the repository root."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub runner already has the Android SDK (ANDROID_HOME). Only add the packages we need.
      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download wake-word models (openWakeWord, CC BY-NC-SA 4.0, personal use only)
        run: |
          set -e
          cd "$PROJECT_DIR"
          mkdir -p app/src/main/assets/wake
          BASE=https://github.com/dscripka/openWakeWord/releases/download/v0.5.1
          for f in melspectrogram.onnx embedding_model.onnx hey_jarvis_v0.1.onnx; do
            curl -fL --retry 3 -o "app/src/main/assets/wake/$f" "$BASE/$f"
          done
          ls -l app/src/main/assets/wake

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Only runs when the build failed: shows just the error lines, short enough for one phone screen.
      - name: Show errors only
        if: failure()
        run: |
          echo "===== ERRORS ====="
          grep -E "^e: |error:|What went wrong|Could not|Unresolved|FAILED" "$RUNNER_TEMP/build.log" \
            | sed -E 's#file:///[^ ]*/app/src/#app/src/#' | cut -c1-230 | head -40 || true

      - name: Publish APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/JARVIS.apk"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$RUNNER_TEMP/JARVIS.apk" \
            --target "$GITHUB_SHA" \
            --title "JARVIS (latest build)" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Download JARVIS.apk and install it on your Android phone."

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Tests run after the APK exists, so a failing test never blocks the download.
      - name: Unit tests (informational)
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon testDebugUnitTest
